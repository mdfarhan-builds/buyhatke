[project]
name = "pricewise-api"
version = "0.1.0"
description = "Accuracy-first, authorized-feed product comparison API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.0",
  "httpx==0.28.1",
  "redis==8.1.0",
  "SQLAlchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricewise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
